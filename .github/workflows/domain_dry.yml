name: "dev: domain dry run"   # כלי מפתח: הרצה יבשה לתחום חדש עם קורות חיים מומצאים. לא שומר ולא נוגע במשתמשים
on:
  workflow_dispatch:
    inputs:
      kind: { description: "design", default: "design" }
      rate_n: { description: "כמה משרות לדרג", default: "6" }
jobs:
  dry:
    if: github.repository == 'orsmo12/findjob'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-jobspy groq httpx python-dotenv ddgs==9.14.4 langgraph
      - run: python -u scripts/domain_dry.py "${{ inputs.kind }}" "${{ inputs.rate_n }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
